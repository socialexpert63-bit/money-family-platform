<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Money Family Hub – Concept</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F8F7F2;--card:#fff;--ink:#252D29;--mut:#66736c;--g:#245344;--mint:#DCECE3;--sage:#9CB8A5;--terra:#C77D62;--yel:#F1D995;--line:#e5e3da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161c19;--card:#1f2824;--ink:#eef2ee;--mut:#9fb0a6;--g:#7fc4a4;--mint:#2a3a33;--sage:#4f6b5b;--line:#2f3b35}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161c19;--card:#1f2824;--ink:#eef2ee;--mut:#9fb0a6;--g:#7fc4a4;--mint:#2a3a33;--sage:#4f6b5b;--line:#2f3b35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Plus Jakarta Sans','DM Sans',sans-serif;margin:0}
.app{display:flex;min-height:100vh}
nav{width:220px;padding:20px 14px;border-right:1px solid var(--line);flex-shrink:0}
.logo{font:800 17px 'Plus Jakarta Sans',sans-serif;color:var(--g);padding:0 8px 16px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:12px;font:500 14px inherit;cursor:pointer;margin-bottom:2px;transition:.2s}
nav button:hover{background:var(--mint)}nav button.on{background:var(--g);color:#fff}
main{flex:1;padding:24px;max-width:1100px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sub{color:var(--mut);margin:4px 0 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(36,83,68,.06);animation:in .5s both}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}.card:nth-child(6){animation-delay:.25s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.k{font:800 26px 'Plus Jakarta Sans',sans-serif;color:var(--g)}.lbl{font-size:13px;color:var(--mut)}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:700 14px inherit;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px)}
.btn.alt{background:var(--mint);color:var(--g)}
.bar{height:9px;background:var(--mint);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .8s}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:14px}
.donut{width:150px;height:150px;border-radius:50%;margin:auto;position:relative}.donut:after{content:"";position:absolute;inset:28px;background:var(--card);border-radius:50%}
.leg{font-size:13px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:4px}.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.tblwrap{overflow-x:auto}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.col{background:var(--mint);border-radius:16px;padding:12px;min-height:160px}.col h3{font-size:14px;margin-bottom:10px}
.dc{background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;font-size:13px;animation:in .4s both}
.pill{display:inline-block;background:var(--yel);color:#4a3b0a;border-radius:20px;padding:2px 9px;font-size:12px}
.mini{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:3px 8px;cursor:pointer;margin:6px 4px 0 0;font-size:12px}
.note{font-size:12px;color:var(--mut);margin-top:18px}
.big{font:800 44px 'Plus Jakarta Sans',sans-serif;color:var(--g);text-align:center}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:18px;font-size:14px}
nav{background:var(--card)}main h1{font-size:30px;color:var(--g)}.card{animation:in .5s backwards;transition:.25s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(36,83,68,.14)}
.k{font-size:30px}.grid .card:first-child{background:linear-gradient(135deg,var(--mint),var(--card))}.col{background:linear-gradient(180deg,var(--mint),transparent)}

:root{--on:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on:#10201a}}:root[data-theme="dark"]{--on:#10201a}
body{background:radial-gradient(900px 420px at 85% -10%,var(--mint),transparent),var(--bg)}
nav{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;width:236px}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.2;padding:4px 8px 20px}
.mk{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--g);color:var(--on);font-size:20px}
nav button{padding:11px 12px;font-size:14px}nav button.on{color:var(--on);box-shadow:0 6px 16px rgba(36,83,68,.28)}
.usr{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;background:var(--mint);border-radius:14px;font-size:13px;line-height:1.3}
.usr small{color:var(--mut)}.av{width:34px;height:34px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-weight:700}
main{max-width:1180px}main>*{animation:in .45s backwards}
.card{border-radius:22px;box-shadow:0 4px 18px rgba(36,83,68,.07)}
.btn{color:var(--on)}.btn.alt{color:var(--g)}
.hero2{background:linear-gradient(120deg,#245344,#3f8068);color:#fff;border-radius:26px;padding:30px;position:relative;overflow:hidden;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.hero2:before{content:"";position:absolute;right:-50px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero2:after{content:"";position:absolute;right:120px;bottom:-80px;width:160px;height:160px;border-radius:50%;background:rgba(241,217,149,.18)}
.hero2>*{position:relative;z-index:1}.hero2 h1{color:#fff!important;font-size:32px}.hero2 .sub{color:#d6e8de}
.ic2{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--mint);margin-bottom:8px;font-size:17px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--mint) 0);display:grid;place-items:center;position:relative}
.ring:after{content:"";position:absolute;inset:10px;background:var(--card);border-radius:50%}.ring b{position:relative;z-index:1;font:800 18px 'Plus Jakarta Sans',sans-serif}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:14px;margin-top:14px}.rgi{text-align:center;font-size:12px;display:grid;gap:6px;justify-items:center}
.dn{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2;font-size:12px;color:var(--mut)}.dn b{font:800 20px 'Plus Jakarta Sans',sans-serif;color:var(--ink)}
tr:hover td{background:var(--mint)}input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:1px}
.dc{border:1px solid var(--line);box-shadow:0 2px 8px rgba(36,83,68,.06)}.dc:hover{transform:translateY(-2px)}

#st{display:none}.sp{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.sl{background:linear-gradient(140deg,#245344,#3f8068);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.sl:before{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08)}
.sl:after{content:"";position:absolute;left:-60px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:rgba(241,217,149,.18)}
.sl>*{position:relative;z-index:1}.sl h1{font-size:clamp(30px,4vw,46px);color:#fff}.sl li{margin:10px 0;color:#d6e8de}
.sr{display:grid;place-items:center;padding:32px}.sr .card{width:100%;max-width:420px}.sr input,.sr select{width:100%;margin:4px 0 12px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.ev:last-child{border:0}
.stk{display:flex;height:16px;border-radius:10px;overflow:hidden;margin:12px 0}.stk i{display:block}
@media(max-width:800px){.sp{grid-template-columns:1fr}.sl{padding:32px 24px}}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;padding:10px;border:0;border-bottom:1px solid var(--line)}.logo,.usr{display:none}nav{position:static;height:auto;flex-direction:row;width:100%}nav button{white-space:nowrap;width:auto}main{padding:16px}}
</style></head><body>
<div id="st"></div><div class="app"><nav id="nav"><div class="logo">🌿 Smart Money Family Hub</div></nav><main id="m"></main></div>
<script>
const S={view:'dash',debts:[{n:'Visa card',b:2400,r:19.9,p:85,w:'Sarah'},{n:'Car finance',b:9800,r:6.4,p:320,w:'Sarah & Tom'},{n:'Education loan',b:5200,r:4.1,p:140,w:'Tom'}],
goals:[{n:'Family Holiday',t:3000,s:1900},{n:'New Bicycle for Nour',t:400,s:260},{n:'Education Savings',t:8000,s:4100},{n:'Emergency Fund',t:5000,s:3400}],
dec:[{t:'Christmas Gift Budget',c:600,col:0},{t:'New Bicycle Purchase',c:400,col:1},{t:'Family Holiday',c:3000,col:1},{t:'School Activity Budget',c:250,col:2},{t:'Monthly Entertainment Budget',c:150,col:3}],
cats:[['Housing',1900,1900,'#245344'],['Groceries',800,720,'#9CB8A5'],['Transportation',450,380,'#C77D62'],['Education',600,540,'#F1D995'],['Family Activities',350,420,'#6f9a86'],['Personal',300,210,'#b9a7c9'],['Other',200,140,'#c9c3b0']],
step:0,secs:300,timer:null};
const NAV=[['dash','🏠 Family Dashboard'],['budget','💰 Money Snapshot'],['debt','🔎 Debt Clarity'],['dec','🧩 Family Decisions'],['goals','🎯 Savings Goals'],['teen','🧒 Parent & Teen'],['learn','📚 Money Learning'],['chk','⏱️ Five-Minute Check-in'],['insights','📈 Insights & Reports']];
const COLS=['To Discuss','Under Consideration','Agreed','Completed'];
const $=s=>document.querySelector(s),usd=n=>'$'+Math.round(n).toLocaleString();
function nav(){$('#nav').innerHTML='<div class="logo"><span class="mk">🌿</span><span>Smart Money<br>Family Hub</span></div>'+NAV.map(([k,l])=>`<button class="${S.view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+'<div class="usr"><span class="av">'+S.name[0]+'</span><span>'+S.name+'<br><small>'+(S.mode=='teen'?'Teen':'Parent')+' view</small></span></div>'}
function go(v){S.view=v;render()}
function count(el,to){let t0=null;const f=ts=>{t0=t0||ts;const p=Math.min((ts-t0)/700,1);el.textContent=(el.dataset.pre||'')+Math.round(to*p).toLocaleString()+(el.dataset.suf||'');if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const IC={Income:'💵',Planned:'📅',Actual:'🧾',Remaining:'🧮',Savings:'🌱',Active:'🎯',Open:'🧩',Total:'📒',Minimum:'🗓️',Highest:'📌'};
function kpi(l,v,pre,suf){const ic=IC[Object.keys(IC).find(k=>l.includes(k))]||'✨';return `<div class="card"><div class="ic2">${ic}</div><div class="lbl">${l}</div><div class="k" data-to="${v}" data-pre="${pre||''}" data-suf="${suf||''}">0</div></div>`}
const open=()=>S.dec.filter(d=>d.col<2).length;
function dash(){const tot=S.cats.reduce((a,c)=>a+c[2],0),plan=S.cats.reduce((a,c)=>a+c[1],0);
let acc=0;const grad=S.cats.map(c=>{const a=acc/tot*100;acc+=c[2];return `${c[3]} ${a}% ${acc/tot*100}%`}).join(',');
const gp=Math.round(S.goals.reduce((a,g)=>a+g.s,0)/S.goals.reduce((a,g)=>a+g.t,0)*100);
return `<div class="hero2"><div><h1>Good morning, ${S.name}!</h1><p class="sub">Let’s make this month’s money decisions a little easier.</p><p style="margin:12px 0 0"><span class="pill">${open()} open decisions</span> <span class="pill">Check-in on Friday</span></p></div><button class="btn" style="background:#fff;color:#245344" onclick="go('dec')">+ Quick Add decision</button></div>
<div class="grid">${kpi('Monthly Family Income',8500,'$')}${kpi('Planned Monthly Spending',plan,'$')}${kpi('Actual Spending',tot,'$')}${kpi('Savings Progress',gp,'','%')}${kpi('Active Financial Goals',S.goals.length)}${kpi('Open Money Decisions',open())}</div>
<div class="two"><div class="card"><h3>Where spending went</h3><div class="donut" style="background:conic-gradient(${grad});margin-top:12px"><div class="dn"><b>${usd(tot)}</b>spent</div></div><div class="leg">${S.cats.map(c=>`<span><b style="background:${c[3]}"></b>${c[0]}</span>`).join('')}</div></div>
<div class="card"><h3>Planned vs actual</h3>${S.cats.map(c=>`<div style="margin-top:8px;font-size:13px">${c[0]} <span class="lbl">${usd(c[2])} of ${usd(c[1])}</span><div class="bar"><i style="width:${Math.min(c[2]/c[1]*100,100)}%;${c[2]>c[1]?'background:var(--terra)':''}"></i></div></div>`).join('')}<p class="sub" style="font-size:13px">Family activities ran above plan. Want to review the remaining activities this month?</p></div></div>
<div class="two"><div class="card"><h3>Family goals</h3><div class="rg">${S.goals.map(g=>{const p=Math.round(g.s/g.t*100);return `<div class="rgi"><div class="ring" style="--p:${p}"><b>${p}%</b></div><span>${g.n}</span></div>`}).join('')}</div></div>
<div class="card" style="background:linear-gradient(135deg,var(--g),#3f8068);color:var(--on)"><h3>Your Family Money Check-in</h3><p>You’ve made progress on your spending plan this month. ${open()} family decisions are still open. Choose one small decision to work through today.</p><button class="btn" style="background:var(--on);color:var(--g)" onclick="go('chk')">Start Check-in</button></div></div>
<div class="card" style="margin-top:14px"><h3>Income allocation</h3>${(()=>{const fx=S.cats[0][2],ev=tot-fx,sv=700,db=S.debts.reduce((a,d)=>a+d.p,0),rem=Math.max(8500-fx-ev-sv-db,0),seg=[['Fixed',fx,'#245344'],['Everyday',ev,'#9CB8A5'],['Savings',sv,'#F1D995'],['Debt payments',db,'#C77D62'],['Remaining',rem,'#c9c3b0']];return `<div class="stk">${seg.map(x=>`<i style="width:${x[1]/85}%;background:${x[2]}"></i>`).join('')}</div><div class="leg">${seg.map(x=>`<span><b style="background:${x[2]}"></b>${x[0]} ${usd(x[1])}</span>`).join('')}</div>`})()}</div>
<div class="two" style="margin-top:14px"><div class="card"><h3>Open decisions</h3>${S.dec.filter(d=>d.col<2).slice(0,3).map(d=>`<div class="ev"><div><b>${d.t}</b><div class="lbl">${usd(d.c)} · ${COLS[d.col]}</div></div><button class="mini" onclick="go('dec')">Open</button></div>`).join('')||'<p class="lbl">All decisions agreed 🌿</p>'}</div><div class="card"><h3>Upcoming money events</h3>${[['🎒','School fees','Fri · $540'],['💡','Electric bill','Mon · $96'],['🌱','Savings transfer','1 Dec · $300'],['💬','Family check-in','Sun · 5 min']].map(e=>`<div class="ev"><div>${e[0]} <b>${e[1]}</b></div><span class="lbl">${e[2]}</span></div>`).join('')}</div></div>`}
function debt(){const T=S.debts.reduce((a,d)=>a+d.b,0),P=S.debts.reduce((a,d)=>a+d.p,0),R=Math.max(...S.debts.map(d=>d.r));
return `<h1>Debt Clarity</h1><p class="sub">Looking is the first move. Start with one clear picture, one line at a time.</p><br>
<div class="grid">${kpi('Total recorded',T,'$')}${kpi('Active accounts',S.debts.length)}${kpi('Minimum payments / month',P,'$')}${kpi('Highest rate',R,'','%')}</div>
<div class="card"><div class="tblwrap"><table><tr><th>Debt</th><th>Balance</th><th>Rate</th><th>Min. payment</th><th>Who can view</th><th></th></tr>${S.debts.map((d,i)=>`<tr><td>${d.n}</td><td>${usd(d.b)}</td><td>${d.r}%</td><td>${usd(d.p)}</td><td>${d.w}</td><td><button class="mini" onclick="S.debts.splice(${i},1);render()">Remove</button></td></tr>`).join('')}</table></div>
<div class="row"><input id="dn" placeholder="Name"><input id="db" type="number" placeholder="Balance"><input id="dr" type="number" step="0.1" placeholder="Rate %"><input id="dp" type="number" placeholder="Min. payment"><select id="dw"><option>Sarah</option><option>Tom</option><option>Sarah &amp; Tom</option></select><button class="btn" onclick="addDebt()">Add record</button></div></div><br>
<div class="card"><h3>Start With One Conversation</h3><p class="sub">“Here’s where we are. Here’s what we’re going to do.”</p><ol style="line-height:1.9"><li>What financial information should we review?</li><li>What do we both understand?</li><li>What decisions are still open?</li><li>What is our next small action?</li></ol></div>
<p class="note">Fictional data. Not financial advice; no lending or consolidation recommendations.</p>`}
function addDebt(){const n=$('#dn').value.trim(),b=+$('#db').value,r=+$('#dr').value,p=+$('#dp').value;if(!n||!b)return;S.debts.push({n,b,r,p,w:$('#dw').value});render()}
function dec(){return `<h1>Our Family Decisions</h1><p class="sub">Small, clear decisions make family money easier.</p><div class="row"><input id="dt" placeholder="New decision"><input id="dcost" type="number" placeholder="Est. cost"><button class="btn" onclick="addDec()">Add</button></div><br>
<div class="kan">${COLS.map((c,ci)=>`<div class="col"><h3>${c} (${S.dec.filter(d=>d.col==ci).length})</h3>${S.dec.map((d,i)=>d.col!=ci?'':`<div class="dc"><b>${d.t}</b><br>${usd(d.c)} <span class="pill">Next: ${['talk this week','compare options','book / buy','done'][ci]}</span><br>${ci>0?`<button class="mini" onclick="mv(${i},-1)">←</button>`:''}${ci<3?`<button class="mini" onclick="mv(${i},1)">Move →</button>`:''}</div>`).join('')}</div>`).join('')}</div>`}
function mv(i,d){S.dec[i].col+=d;render()}
function addDec(){const t=$('#dt').value.trim();if(!t)return;S.dec.push({t,c:+$('#dcost').value||0,col:0});render()}
function goals(){return `<h1>Savings Goals</h1><p class="sub">Steady progress, together.</p><br><div class="grid">${S.goals.map((g,i)=>{const p=Math.round(g.s/g.t*100);return `<div class="card"><h3>${g.n}</h3><div class="ring" style="--p:${p};margin:14px auto"><b>${p}%</b></div><p class="lbl">${usd(g.s)} saved · ${usd(g.t-g.s)} to go</p>${p>=100?'<span class="pill">🎉 Goal reached</span>':`<button class="btn alt" onclick="S.goals[${i}].s=Math.min(S.goals[${i}].t,S.goals[${i}].s+50);render()">+ $50</button>`}</div>`}).join('')}</div>
<div class="row"><input id="gn" placeholder="New goal"><input id="gt" type="number" placeholder="Target"><button class="btn" onclick="addGoal()">Create goal</button></div>`}
S.mode='parent';S.allow=40;S.req=[{t:'Buy a $25 game with savings',ok:0},{t:'Extra $10 for a school trip',ok:0}];
function teen(){const p=S.mode=='parent',sv=Math.round(S.allow*.3),sp=S.allow-sv;
const tabs=`<div class="row"><button class="btn ${p?'':'alt'}" onclick="S.mode='parent';render()">Parent view</button><button class="btn ${p?'alt':''}" onclick="S.mode='teen';render()">Teen view</button></div><br>`;
if(p)return `<h1>Parent &amp; Teen Space</h1><p class="sub">Build money habits together. You choose what’s visible.</p><br>${tabs}<div class="two"><div class="card"><h3>${S.teen}, 13</h3><p class="lbl">Monthly allowance</p><div class="k">${usd(S.allow)}</div><input type="range" min="10" max="100" step="5" value="${S.allow}" oninput="S.allow=+this.value;render()" style="width:100%"><p class="lbl">30% saving (${usd(sv)}) · spending ${usd(sp)}</p><p class="lbl">Lessons: 3 of 7 complete</p></div><div class="card"><h3>Pending approvals</h3>${S.req.map((r,i)=>`<p>${r.t} ${r.ok?'<span class="pill">Approved</span>':`<button class="mini" onclick="S.req[${i}].ok=1;render()">Approve</button>`}</p>`).join('')}<p class="note">Parent finances and debt records stay hidden from the teen view.</p></div></div>`;
return `<h1>Hi ${S.teen}! 👋</h1><p class="sub">Your money, your goals.</p><br>${tabs}<div class="grid"><div class="card"><div class="lbl">My Money</div><div class="k">${usd(S.allow)}</div></div><div class="card"><div class="lbl">My Savings Goal: New Bicycle</div><div class="bar"><i style="width:65%"></i></div><div class="lbl">$260 of $400</div></div><div class="card"><div class="lbl">Money Lesson</div><b>Needs vs Wants</b><br><button class="mini" onclick="this.textContent='Nice work! ✅'">Mark complete</button></div></div><div class="card"><h3>Think before you buy</h3><p>Compare two prices, then wait a day. What would you rather save for?</p></div>`}
S.notes=[['Three family decisions are open','dec'],['School fees due Friday','dash'],['Nour reached 65% on the bicycle goal','goals']];S.showN=false;S.streak=4;S.hist=[3100,3350,3600,3480,3720,3840];S.month='Nov';
S.lessons=[{t:'Where Does Your Money Go?',q:'Which is a fixed expense?',o:['Rent','Snacks','Movie night'],a:0},{t:'Needs vs Wants',q:'Which is a want?',o:['Groceries','Streaming add-on','School books'],a:1},{t:'What Does Interest Mean?',q:'Interest is…',o:['A gift','The cost of borrowing','Only a bank fee'],a:1}];
function topbar(){return `<div class="bar2"><div><b>${S.month} 2026</b> · ${S.fam}</div><div class="row" style="margin:0"><button class="mini" onclick="S.showN=!S.showN;render()">🔔 ${S.notes.length}</button><button class="mini" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">🌓 Theme</button><button class="mini" onclick="present()">▶ Present / stop</button><button class="mini" onclick="S.started=false;render()">🏡 Start screen</button></div></div>${S.showN?`<div class="card" style="margin-bottom:14px">${S.notes.map(n=>`<p style="margin:4px 0"><a href="#" onclick="S.showN=false;go('${n[1]}');return false">${n[0]}</a></p>`).join('')||'All caught up 🌿'}<button class="mini" onclick="S.notes=[];render()">Clear all</button></div>`:''}`}
function present(){if(S.pt){clearInterval(S.pt);S.pt=null;return}const ks=NAV.map(n=>n[0]);let i=0;S.pt=setInterval(()=>{i=(i+1)%ks.length;go(ks[i])},4000)}
function budget(){const pl=S.cats.reduce((a,c)=>a+c[1],0),ac=S.cats.reduce((a,c)=>a+c[2],0);
return `<h1>Money Snapshot &amp; Budget</h1><p class="sub">Where money comes from, where it goes, and what’s committed.</p><br><div class="grid">${kpi('Income',8500,'$')}${kpi('Planned',pl,'$')}${kpi('Actual',ac,'$')}${kpi('Remaining plan',Math.max(pl-ac,0),'$')}</div>
<div class="card"><div class="tblwrap"><table><tr><th>Category</th><th>Planned</th><th>Actual</th><th>Remaining</th><th>Used</th></tr>${S.cats.map((c,i)=>`<tr><td>${c[0]}</td><td><input type="number" value="${c[1]}" style="width:90px" onchange="S.cats[${i}][1]=+this.value||0;render()"></td><td>${usd(c[2])}</td><td>${usd(c[1]-c[2])}</td><td>${c[1]?Math.round(c[2]/c[1]*100):0}%</td></tr>`).join('')}</table></div>
<div class="row"><select id="ec">${S.cats.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select><input id="ea" type="number" placeholder="Expense $"><button class="btn" onclick="addExp()">Add expense</button><input id="nc" placeholder="New category"><button class="btn alt" onclick="addCat()">Add category</button></div></div><p class="note">Edit a planned amount or add an expense and the dashboard donut and bars update.</p>`}
function addExp(){const a=+$('#ea').value;if(!a)return;S.cats[+$('#ec').value][2]+=a;S.notes.unshift(['Expense added: '+usd(a),'budget']);render()}
function addCat(){const n=$('#nc').value.trim();if(!n)return;S.cats.push([n,200,0,'#8fa39a']);render()}
function learn(){const dn=S.lessons.filter(l=>l.d).length;return `<h1>Learn Money. Make Better Decisions.</h1><p class="sub">Short lessons for parents and teens. 🔥 ${S.streak}-day streak</p><br><div class="card"><div class="row" style="justify-content:space-between;margin:0"><b>Progress</b><span>${dn} of ${S.lessons.length}</span></div><div class="bar"><i style="width:${dn/S.lessons.length*100}%"></i></div></div><br><div class="grid">${S.lessons.map((l,i)=>`<div class="card"><h3>${l.t}</h3><p class="lbl">${l.q}</p>${l.d?'<span class="pill">✅ Completed</span>':l.o.map((o,j)=>`<button class="mini" onclick="ans(${i},${j})">${o}</button>`).join('')}${l.m?`<p>${l.m}</p>`:''}</div>`).join('')}</div>${dn==S.lessons.length?'<div class="card" style="margin-top:14px"><h3>🎓 Certificate of completion (sample)</h3><p>Great work finishing the starter path.</p></div>':''}`}
function ans(i,j){const l=S.lessons[i];if(j==l.a){l.d=1;l.m=''}else l.m='Not quite. Have another look 🙂';render()}
function reportHtml(){const ac=S.cats.reduce((a,c)=>a+c[2],0);return `<div class="card" style="margin-top:14px"><h2>Family report · ${S.month} 2026</h2><p>Income $8,500 · Spending ${usd(ac)} · Active goals ${S.goals.length}</p><p>Debt records: ${S.debts.length}, minimum payments ${usd(S.debts.reduce((a,d)=>a+d.p,0))}/month.</p><p>Open decisions: ${S.dec.filter(d=>d.col<2).length}. Completed: ${S.dec.filter(d=>d.col==3).length}.</p><p class="note">Fictional sample data.</p></div>`}
function insights(){const mx=Math.max(...S.hist),ms=['Jun','Jul','Aug','Sep','Oct','Nov'],over=S.cats.filter(c=>c[2]>c[1]).map(c=>c[0]),done=S.dec.filter(d=>d.col==3).length,op=S.dec.filter(d=>d.col==0).length;
const obs=[over.length?over.join(', ')+' ran above plan this month. Worth a look together.':'Every category stayed within plan.',`${done} family decision(s) completed; ${op} still waiting for discussion.`,`${S.goals.filter(g=>g.s>=g.t).length} goal(s) reached; ${S.goals.length} active.`,'Consider reviewing next month’s larger purchases together.'];
return `<h1>Insights &amp; Reports</h1><p class="sub">Progress over time, without the jargon.</p><br><div class="two"><div class="card"><h3>Monthly spending trend</h3><div style="display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:12px">${S.hist.map((v,i)=>`<div style="flex:1;text-align:center;font-size:11px"><div style="height:${v/mx*120}px;background:${i==5?'var(--g)':'var(--sage)'};border-radius:8px 8px 0 0"></div>${ms[i]}</div>`).join('')}</div></div><div class="card"><h3>Observations</h3>${obs.map(o=>`<p style="margin:8px 0">🌿 ${o}</p>`).join('')}</div></div><button class="btn" onclick="S.rep=!S.rep;render()">${S.rep?'Hide':'Preview'} monthly report</button> <button class="btn alt" onclick="window.print()">Print</button>${S.rep?reportHtml():''}`}
S.name='Sarah';S.fam='The Sarah family';S.teen='Nour';S.started=false;
function start(){$('#st').innerHTML=`<div class="sp"><div class="sl"><div class="logo" style="color:#fff"><span class="mk" style="background:#fff;color:#245344">🌿</span><span>Smart Money<br>Family Hub</span></div><h1 style="margin-top:28px">Less money stress. Better family decisions.</h1><p style="color:#d6e8de;max-width:460px;font-size:17px">Money stress usually isn’t about income. It’s about too many open decisions. Organize money, plan together and start one small conversation.</p><ul style="padding-left:18px"><li>See your family money in one calm view</li><li>Agree decisions on a shared board</li><li>Look at debt without shame</li><li>Hold a five-minute check-in</li></ul></div><div class="sr"><div class="card"><h2>Create your sample family</h2><p class="sub">Everything here is fictional. No bank details needed.</p><br><label class="lbl">Your first name</label><input id="sn" value="${S.name}"><label class="lbl">Family name</label><input id="sf" value="${S.fam}"><label class="lbl">Teen’s name</label><input id="stn" value="${S.teen}"><label class="lbl">Start as</label><select id="sm"><option value="parent">Parent</option><option value="teen">Teen</option></select><button class="btn" style="width:100%" onclick="enter()">Enter the Hub →</button><p class="note">Independent concept inspired by The Smart Money Family. Not financial advice.</p></div></div></div>`}
function enter(){S.name=$('#sn').value.trim()||'Sarah';S.fam=$('#sf').value.trim()||'The Sarah family';S.teen=$('#stn').value.trim()||'Nour';S.goals[1].n='New Bicycle for '+S.teen;S.notes[2]=[S.teen+' reached 65% on the bicycle goal','goals'];S.mode=$('#sm').value;S.view=S.mode=='teen'?'teen':'dash';S.started=true;render()}
function addGoal(){const n=$('#gn').value.trim(),t=+$('#gt').value;if(!n||!t)return;S.goals.push({n,t,s:0});render()}
const STEPS=[['Where are we?','Income $8,500 · spending $3,840 so far · savings on track.'],['What needs attention?',()=>S.dec.filter(d=>d.col<2).slice(0,2).map(d=>d.t).join(' and ')||'Nothing open. Nice.'],['What are we planning?','School fees, recurring bills, and goal contributions this month.'],['What do we agree?','Pick one decision and write what everyone thinks.'],['What’s next?','Assign one small next action and a date.']];
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function chk(){const s=S.step;if(s>=5)return `<div class="card"><h2>🎉 Check-in complete</h2><p>Decisions reviewed: ${open()}. One agreed action recorded. Next check-in: same time next week.</p><button class="btn" onclick="S.step=0;S.secs=300;render()">Start another</button></div>`;
const b=STEPS[s][1];return `<h1>Five Minutes for a Better Money Conversation</h1><p class="sub">You don’t need to solve everything today. Start with one decision.</p><br><div class="card"><div class="lbl">Step ${s+1} of 5</div><div class="bar"><i style="width:${(s+1)*20}%"></i></div><h2>${STEPS[s][0]}</h2><p>${typeof b=='function'?b():b}</p><textarea style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit" rows="3" placeholder="Add a note…"></textarea><div class="row"><button class="btn alt" onclick="tick()">${S.timer?'Pause':'Start'} timer · <span id="tm">${fmt(S.secs)}</span></button><button class="btn" onclick="S.step++;render()">${s==4?'Finish':'Next'}</button></div></div>`}
function tick(){if(S.timer){clearInterval(S.timer);S.timer=null}else S.timer=setInterval(()=>{S.secs=Math.max(0,S.secs-1);const e=$('#tm');if(e)e.textContent=fmt(S.secs)},1000);render()}
function render(){const sa=S.started;document.querySelector('.app').style.display=sa?'':'none';$('#st').style.display=sa?'none':'block';if(!sa){start();return}nav();const v={dash,budget,debt,dec,goals,teen,learn,chk,insights}[S.view]();$('#m').innerHTML=topbar()+v+(S.view=='dash'?'<p class="note">Independent concept inspired by The Smart Money Family. All data is fictional. Not a banking or financial advice product.</p>':'');document.querySelectorAll('.k[data-to]').forEach(e=>count(e,+e.dataset.to))}
render();
</script></body></html>
